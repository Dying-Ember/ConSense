server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 256m;
    location /api/ {
        proxy_pass http://consense-backend:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }
    location / { try_files $uri $uri/ /index.html; }
}

# 无 MySQL 时的兜底方案（H2 自动建表，不走 Flyway）：
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# 旧 H2 文件的大字段转换仅在已关闭克隆验证并保全原库后，显式设置
#   --consense.h2.source-clob-upgrade=true；默认启动不会执行 V28。
spring:
  datasource:
    url: "${CONSENSE_H2_JDBC_URL:jdbc:h2:file:./data/consense;AUTO_SERVER=TRUE;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE}"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

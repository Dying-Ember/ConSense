Global:
  model_name: PP-OCRv6_tiny_det
Hpi:
  backend_configs:
    paddle_infer:
      trt_dynamic_shapes: &id001
        x:
        - - 1
          - 3
          - 32
          - 32
        - - 1
          - 3
          - 736
          - 736
        - - 1
          - 3
          - 4000
          - 4000
    tensorrt:
      dynamic_shapes: *id001
PostProcess:
  box_thresh: 0.4
  max_candidates: 3000
  name: DBPostProcess
  thresh: 0.2
  unclip_ratio: 1.4
PreProcess:
  transform_ops:
  - DecodeImage:
      channel_first: false
      img_mode: BGR
  - DetLabelEncode: null
  - DetResizeForTest: null
  - NormalizeImage:
      mean:
      - 0.485
      - 0.456
      - 0.406
      order: hwc
      scale: 1./255.
      std:
      - 0.229
      - 0.224
      - 0.225
  - ToCHWImage: null
  - KeepKeys:
      keep_keys:
      - image
      - shape
      - polys
      - ignore_tags
MinerU:
  limit_side_len: 960
  limit_type: max
  max_side_limit: 4000
  thresh: 0.3
  box_thresh: 0.5
  unclip_ratio: 1.5
  max_candidates: 1000
  use_dilation: false
  box_type: quad
